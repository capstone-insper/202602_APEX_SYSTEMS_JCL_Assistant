name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # same as infra/setup.sh
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            rag-llm/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: pytest
        working-directory: rag-llm
      - run: pytest
        working-directory: backend
      - run: pytest eval

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"  # same as infra/setup.sh
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
